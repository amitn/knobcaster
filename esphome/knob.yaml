# Backlight (GPIO47, active-high). LEDC so we can dim before sleep.
output:
  - platform: ledc
    pin: 47
    id: backlight_pwm
light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    restore_mode: ALWAYS_ON

# --- Touch (CST816) ----------------------------------------------------------
touchscreen:
  - platform: cst816
    id: knob_touch
    interrupt_pin: 9
    reset_pin: 10
    # address 0x15 is the cst816 default

# --- Rotary encoder + button -------------------------------------------------
sensor:
  - platform: rotary_encoder
    name: "Knob"
    id: knob_encoder
    pin_a: 8
    pin_b: 7
    # Knob -> relative volume on the active speaker. NB: this board pulses +/-1
    # per detent and returns to 0; detent counting needs on-hardware validation
    # (the IDF build has anti-glitch decode in bsp/knob.c).
    on_clockwise:
      - lambda: "id(cast).request_step_volume(+3);"
    on_anticlockwise:
      - lambda: "id(cast).request_step_volume(-3);"

binary_sensor:
  - platform: gpio
    name: "Knob button"
    id: knob_button
    pin:
      number: 0          # BOOT/strapping, active-low
      mode: INPUT_PULLUP
      inverted: true

# --- UI (LVGL) ---------------------------------------------------------------
# Phase-2: now-playing screen (device name, title/artist, volume arc, transport,
# progress bar). Minimal placeholder for now.
lvgl:
  displays:
    - knob_lcd
  touchscreens:
    - knob_touch
  pages:
    - id: now_playing
      bg_color: 0x000000
      widgets:
        # Volume ring (updated from the cast volume sensor).
        - arc:
            id: ui_vol_arc
            align: CENTER
            width: 340
            height: 340
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            arc_color: 0x0A84FF
            indicator:
              arc_color: 0x0A84FF
        # Active speaker (top).
        - label:
            id: ui_device
            align: TOP_MID
            y: 64
            text: "Cast Knob"
            text_color: 0xFFFFFF
        # Now playing "title - artist" (center).
        - label:
            id: ui_title
            align: CENTER
            y: -8
            text: "ready"
            text_color: 0xFFFFFF
            text_align: CENTER
            long_mode: dot
            width: 240
        # Transport buttons -> cast_controller command queue.
        - button:
            align: BOTTOM_MID
            x: -72
            y: -36
            width: 52
            height: 52
            widgets:
              - label: { align: CENTER, text: "<<" }
            on_press:
              - lambda: "id(cast).request_prev();"   # CMD_PREV
        - button:
            align: BOTTOM_MID
            x: 0
            y: -36
            width: 52
            height: 52
            widgets:
              - label: { align: CENTER, text: "|>" }
            on_press:
              - lambda: "id(cast).request_play_pause();"   # CMD_PLAYPAUSE
        - button:
            align: BOTTOM_MID
            x: 72
            y: -36
            width: 52
            height: 52
            widgets:
              - label: { align: CENTER, text: ">>" }
            on_press:
              - lambda: "id(cast).request_next();"   # CMD_NEXT

