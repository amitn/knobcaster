# ESPHome config for the Waveshare ESP32-S3-Knob-Touch-LCD-1.8.
#
# STATUS: Phase-1 hardware scaffold (branch esphome-port). This brings up the
# board's peripherals under ESPHome; the Google Cast control + custom UI are
# later phases (see docs/08-esphome-port.md). Pins are from components/bsp/
# include/board_pins.h. NOT yet validated on hardware — treat as a starting point.
#
# Build:  esphome run esphome/knob.yaml   (or via the ESPHome dashboard)

esphome:
  name: cast-knob
  friendly_name: Cast Knob
  platformio_options:
    # Enable LVGL's bidirectional text so RTL Hebrew song titles render in the
    # correct visual order (ESPHome scans build_flags into lv_conf.h). Pairs with
    # base_dir: AUTO on the Hebrew labels. Mirrors LV_USE_BIDI in the vanilla build.
    build_flags:
      - "-DLV_USE_BIDI=1"

esp32:
  board: esp32-s3-devkitc-1   # custom 16MB flash / 8MB OPI PSRAM (see flash_size)
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal        # ESP32-S3R8 OPI PSRAM (matches CONFIG_SPIRAM_MODE_OCT)
  speed: 80MHz

logger:
  # Native USB-Serial/JTAG console, like the IDF build.
  hardware_uart: USB_SERIAL_JTAG

# Local external components (esphome/components/). cast_controller builds the
# shared components/cast/ stack into this target — same code as the IDF firmware.
external_components:
  - source:
      type: local
      path: components

cast_controller:
  id: cast
  display: knob_lcd   # for the 'S' screenshot key (serial debug console)
  haptics: haptics    # click per physical detent
  # The physical encoder is decoded INSIDE cast_controller (PCNT, ported from
  # components/bsp/knob.c). ESPHome's stock rotary_encoder can't decode this board
  # (it pulses PCNT +/-1 per detent and returns to 0), so it is NOT used. The knob
  # has no push switch, so speaker selection is by touch swipe (see now_playing).
  devices_found:
    name: "Cast devices found"
  now_playing:
    name: "Now playing"
    on_value:
      - lvgl.label.update:
          id: ui_title
          text: !lambda "return x.c_str();"
  current_device:
    name: "Current device"
    on_value:
      - lvgl.label.update:
          id: ui_device
          text: !lambda "return x.c_str();"
      # On speaker change: hide the old album art (cleared until the new one lands)
      # and recolor the volume ring so each speaker has a distinct indicator color.
      - lvgl.widget.hide: ui_art
      - lambda: |-
          static const uint32_t palette[] = {
            0x0A84FF, 0xFF375F, 0x30D158, 0xFF9F0A, 0xBF5AF2, 0x64D2FF, 0xFFD60A, 0xFF6B22};
          int idx = id(cast).current_index();
          lv_color_t c = lv_color_hex(palette[idx % 8]);
          lv_obj_set_style_arc_color(id(ui_vol_arc), c, LV_PART_INDICATOR);
  art_url:
    # Album-art URL from the media status -> fetch via online_image (HTTP + JPEG
    # decode), then show on the LVGL background image. Internal (long signed URL).
    id: cast_art_url
    internal: true
    on_value:
      # Empty URL (e.g. just switched speakers / no media) -> keep art hidden.
      # Otherwise fetch; the image is shown again on_download_finished.
      - lambda: |-
          if (x.length() > 0) { id(art_img).set_url(x.c_str()); id(art_img).update(); }
          else { lv_obj_add_flag(id(ui_art), LV_OBJ_FLAG_HIDDEN); }
  volume:
    name: "Cast volume"
    on_value:
      - lvgl.arc.update:
          id: ui_vol_arc
          value: !lambda "return (int) x;"

# HA-controllable entities -> cast_controller command queue (template platforms,
# so no custom number/button platform code is needed).
number:
  - platform: template
    name: "Cast volume set"
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    set_action:
      - lambda: "id(cast).request_set_volume(x);"

button:
  - platform: template
    name: "Play Pause"
    on_press:
      - lambda: "id(cast).request_play_pause();"
  - platform: template
    name: "Next track"
    on_press:
      - lambda: "id(cast).request_next();"
  - platform: template
    name: "Previous track"
    on_press:
      - lambda: "id(cast).request_prev();"
  - platform: template
    name: "Mute toggle"
    on_press:
      - lambda: "id(cast).request_mute();"

# --- Connectivity ------------------------------------------------------------
wifi:
  # No creds compiled in: fall back to an AP + captive portal (mirrors our
  # provisioning component). HA/ESPHome can also push creds.
  ap:
    ssid: "CastKnob-Setup"
  # Show the Wi-Fi-setup QR screen until connected, then the now-playing screen.
  on_connect:
    - lvgl.page.show: now_playing
  on_disconnect:
    - lvgl.page.show: wifi_setup

captive_portal:

# BLE/serial provisioning (nicer than our QR portal; optional).
improv_serial:

# ESPHome/HA-dashboard OTA (replaces components/ota for this build).
ota:
  - platform: esphome

# --- Buses -------------------------------------------------------------------
i2c:
  sda: 11
  scl: 12
  frequency: 400kHz

# DRV2605 haptics (I2C 0x5A) — a click per encoder detent (effect 24, as tuned
# on hardware for the vanilla build).
drv2605:
  id: haptics

# --- Display (SH8601 QSPI AMOLED, 360x360) ----------------------------------
# Custom external component (esphome/components/sh8601) wrapping the
# espressif/esp_lcd_sh8601 IDF driver — it frames SH8601's QSPI commands
# correctly (ESPHome's built-in qspi_dbi does not; see docs/08). Init table is
# shared with the vanilla driver (components/bsp/include/sh8601_init_cmds.h).
display:
  - platform: sh8601
    id: knob_lcd
    cs_pin: 14
    reset_pin: 21
    clk_pin: 13
    data_pins: [15, 16, 17, 18]   # DATA0..DATA3
    dimensions:
      width: 360
      height: 360

# Backlight (GPIO47, active-high). LEDC so we can dim before sleep.
output:
  - platform: ledc
    pin: 47
    id: backlight_pwm
light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    restore_mode: ALWAYS_ON

# --- Touch (CST816) ----------------------------------------------------------
touchscreen:
  - platform: cst816
    id: knob_touch
    interrupt_pin: 9
    reset_pin: 10
    # address 0x15 is the cst816 default

# --- Rotary encoder + button -------------------------------------------------
# Handled inside cast_controller (PCNT encoder + GPIO0 button ISR, decoded by the
# same algorithm as components/bsp/knob.c). ESPHome's stock `rotary_encoder` /
# `binary_sensor: gpio` were removed: this board pulses PCNT +/-1 per detent and
# returns to 0, which the stock accumulator can't decode (it nets ~0 and never
# fires). Pins: A=8 B=7 button=0 (from board_pins.h).

# Album art: fetched + JPEG-decoded over HTTP (mirrors components/albumart). The
# cast_controller art_url binding sets the URL and triggers update() per track.
http_request:
  verify_ssl: false   # Google/Cast art hosts; mirrors the IDF build's skip-verify
online_image:
  - id: art_img
    url: "https://www.gstatic.com/images/branding/product/2x/cast_64dp.png"
    format: JPEG      # Cast/Google art is served as JPEG (on_error logs any mismatch)
    type: RGB565
    resize: 360x360
    update_interval: never
    # The fetch+decode is async; refresh the LVGL image when it lands, else the
    # widget keeps showing the previous (or blank) art.
    on_download_finished:
      - lvgl.image.update:
          id: ui_art
          src: art_img
      - lvgl.widget.show: ui_art   # reveal once the new art has decoded
    on_error:
      - logger.log:
          format: "album art fetch/decode failed"
          level: WARN

# Apply buffered encoder detents to the speaker-list roller (only nonzero while
# the list page is in list-mode; keeps LVGL out of cast_controller).
interval:
  - interval: 80ms
    then:
      - lambda: |-
          int d = id(cast).take_list_scroll();
          if (d != 0) {
            lv_obj_t *r = id(spk_roller)->obj;
            int n = (int) lv_roller_get_option_count(r);
            if (n > 0) {
              int ni = (int) lv_roller_get_selected(r) + d;
              if (ni < 0) ni = 0;
              if (ni > n - 1) ni = n - 1;
              lv_roller_set_selected(r, ni, LV_ANIM_ON);
            }
          }

# --- Fonts -------------------------------------------------------------------
# DejaVu Sans subset: Latin (GF_Latin_Core, incl. accented European names) plus
# the Hebrew letters. The default Montserrat is Latin-only, so Hebrew song titles
# rendered as tofu boxes; this is the ESPHome analogue of the vanilla build's
# Tiny-TTF DejaVu subset (scripts/gen_font.py). ESPHome ships no Hebrew glyphset,
# so the Hebrew block (U+05D0..U+05EA + maqaf/geresh/gershayim) is listed
# explicitly below (UTF-8 literals; all present in DejaVuSans).
font:
  - id: ui_font
    file: "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
    size: 20
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    glyphs:
      - "א"
      - "ב"
      - "ג"
      - "ד"
      - "ה"
      - "ו"
      - "ז"
      - "ח"
      - "ט"
      - "י"
      - "ך"
      - "כ"
      - "ל"
      - "ם"
      - "מ"
      - "ן"
      - "נ"
      - "ס"
      - "ע"
      - "ף"
      - "פ"
      - "ץ"
      - "צ"
      - "ק"
      - "ר"
      - "ש"
      - "ת"
      - "־"
      - "׳"
      - "״"

# --- UI (LVGL) ---------------------------------------------------------------
# Now-playing screen: album-art background, volume arc, device + title, transport.
lvgl:
  displays:
    - knob_lcd
  touchscreens:
    - knob_touch
  # Small partial buffer: a full 360x360 flush needs a 259KB internal DMA bounce
  # buffer (LVGL's buffer is in PSRAM), which won't allocate. ~1/8 screen fits.
  buffer_size: 12%
  # esp_lcd_sh8601 wants big-endian RGB565 on the panel (little_endian rendered
  # blue as green with magenta/cyan edge fringing). The screenshot path swaps to
  # little-endian itself for scripts/fbdump.py.
  byte_order: big_endian
  pages:
    # Wi-Fi setup (shown until connected): scan the QR to join the CastKnob-Setup
    # AP, then the captive portal opens to enter home Wi-Fi. Mirrors the vanilla
    # provisioning screen.
    - id: wifi_setup
      bg_color: 0x000000
      widgets:
        - label:
            align: TOP_MID
            y: 36
            text: "Set up Wi-Fi"
            text_color: 0xFFFFFF
        - qrcode:
            id: wifi_qr
            align: CENTER
            size: 170
            light_color: 0xFFFFFF   # light bg so phones can scan it
            dark_color: 0x000000
            text: "WIFI:S:CastKnob-Setup;T:nopass;;"
        - label:
            align: BOTTOM_MID
            y: -34
            text: "Scan, or join CastKnob-Setup"
            text_color: 0xAAAAAA
    - id: now_playing
      bg_color: 0x000000
      # Swipe to change the active speaker (right=next, left=prev); swipe down for
      # the full speaker list. Gestures fire on the touched widget and bubble up.
      on_swipe_right:
        - lambda: "id(cast).request_next_device(); id(haptics).play();"
      on_swipe_left:
        - lambda: "id(cast).request_prev_device(); id(haptics).play();"
      on_swipe_down:
        # Fill the roller from the live discovery list, open it on the active
        # speaker, switch the encoder to list-scroll mode, then show the page.
        - lambda: |-
            lv_obj_t *r = id(spk_roller)->obj;
            lv_roller_set_options(r, id(cast).device_list_str().c_str(), LV_ROLLER_MODE_NORMAL);
            lv_roller_set_selected(r, id(cast).current_index(), LV_ANIM_OFF);
            id(cast).set_list_mode(true);
        - lvgl.page.show: speaker_list
        - lambda: "id(haptics).play();"
      widgets:
        # Album art, dimmed, behind everything (first widget = bottom z-order).
        - image:
            id: ui_art
            src: art_img
            align: CENTER
            opa: 40%
        # Volume ring (updated from the cast volume sensor).
        - arc:
            id: ui_vol_arc
            align: CENTER
            width: 340
            height: 340
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            arc_color: 0x303030       # dim background ring
            indicator:
              arc_color: 0x0A84FF     # filled portion = volume level
        # Active speaker (top).
        - label:
            id: ui_device
            align: TOP_MID
            y: 64
            text: "Cast Knob"
            text_color: 0xFFFFFF
            text_font: ui_font
            base_dir: AUTO   # speaker names may be Hebrew (RTL)
        # Now playing "title - artist" (center).
        - label:
            id: ui_title
            align: CENTER
            y: -8
            text: "ready"
            text_color: 0xFFFFFF
            text_align: CENTER
            long_mode: dot
            width: 240
            text_font: ui_font
            base_dir: AUTO   # Hebrew song titles render RTL via LV_USE_BIDI
        # Transport buttons -> cast_controller command queue.
        - button:
            align: BOTTOM_MID
            x: -72
            y: -36
            width: 52
            height: 52
            widgets:
              - label: { align: CENTER, text: "<<" }
            on_press:
              - lambda: "id(cast).request_prev();"   # CMD_PREV
        - button:
            align: BOTTOM_MID
            x: 0
            y: -36
            width: 52
            height: 52
            widgets:
              - label: { align: CENTER, text: "|>" }
            on_press:
              - lambda: "id(cast).request_play_pause();"   # CMD_PLAYPAUSE
        - button:
            align: BOTTOM_MID
            x: 72
            y: -36
            width: 52
            height: 52
            widgets:
              - label: { align: CENTER, text: ">>" }
            on_press:
              - lambda: "id(cast).request_next();"   # CMD_NEXT
    # Speaker picker (swipe down from now-playing). The roller is filled at runtime
    # from the live discovery list; tap a name to switch, or "Select" the centered
    # one. Swipe up (or Back) returns to now-playing.
    - id: speaker_list
      bg_color: 0x000000
      on_swipe_up:
        - lambda: "id(cast).set_list_mode(false);"   # encoder controls volume again
        - lvgl.page.show: now_playing
      widgets:
        - label:
            align: TOP_MID
            y: 24
            text: "Speakers"
            text_color: 0xFFFFFF
            text_font: ui_font
        - roller:
            id: spk_roller
            align: CENTER
            y: 6
            width: 300
            visible_row_count: 5
            text_font: ui_font
            base_dir: AUTO   # Hebrew speaker names render RTL
            options:
              - "(no speakers)"   # placeholder, replaced at runtime on swipe-down
        - button:
            align: BOTTOM_MID
            y: -22
            width: 140
            height: 46
            widgets:
              - label: { align: CENTER, text: "Select" }
            on_press:
              # Switch to the roller's centered speaker, then return to now-playing.
              - lambda: |-
                  id(cast).request_select_device(lv_roller_get_selected(id(spk_roller)->obj));
                  id(cast).set_list_mode(false);
                  id(haptics).play();
              - lvgl.page.show: now_playing

