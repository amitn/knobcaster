name: CI

# Host-only gates that need no hardware: the native unit tests and the firmware
# compile. Mirrors `just test` and `just build` (both run PlatformIO inside the
# uv-managed venv). See docs/07-testing.md.

on:
  push:
    branches: [main, esphome-port, elecrow-port]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (+ cache the venv)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync toolchain (PlatformIO in the uv venv)
        run: just setup

      # Pure parsers (cast_proto + cast_status), compiled with the host gcc —
      # no ESP-IDF toolchain download needed, so this gate is fast.
      - name: Run host-native tests
        run: just test

  build:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (+ cache the venv)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install just
        uses: extractions/setup-just@v2

      # The espressif32 platform + Xtensa toolchain + ESP-IDF are ~GB; cache
      # them across runs keyed on the files that pin the toolchain/components.
      - name: Cache PlatformIO platforms & toolchains
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/**', 'sdkconfig.defaults', 'src/idf_component.yml') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Sync toolchain (PlatformIO in the uv venv)
        run: just setup

      - name: Compile firmware
        run: just build

  esphome:
    name: ESPHome build (shared cast stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (+ cache its tool downloads)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      # ESPHome compiles via PlatformIO/ESP-IDF too (~GB toolchain); cache it.
      - name: Cache ESPHome PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: esphome-pio-${{ runner.os }}-${{ hashFiles('esphome/knob.yaml', 'components/cast/**') }}
          restore-keys: |
            esphome-pio-${{ runner.os }}-

      # Validate + compile the ESPHome target. This is the gate that keeps the
      # two-target reuse honest: it builds components/cast/ into the ESPHome
      # firmware, so a change there that breaks the ESPHome build fails CI.
      - name: Validate ESPHome config (both boards)
        run: |
          just esphome-config
          just esphome-elecrow-config

      - name: Compile ESPHome firmware
        run: just esphome-build

  # Build all three firmwares and publish the web-flashable factory images as a
  # downloadable workflow artifact (grab them from the run's "Artifacts" section —
  # signed-in GitHub users only; for anonymous downloads, cut a Release instead).
  firmware:
    name: Firmware artifacts (all 3 builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (+ cache the venv / esphome downloads)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache PlatformIO platforms & toolchains
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/**', 'sdkconfig.defaults', 'src/idf_component.yml', 'esphome/**.yaml', 'components/cast/**') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Sync toolchain (PlatformIO + esptool in the uv venv)
        run: just setup

      - name: Build all firmwares (vanilla + both ESPHome)
        run: just dist-all "ci-${{ github.ref_name }}"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_number }}
          path: dist/*
          retention-days: 30
