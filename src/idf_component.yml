# Managed ESP-IDF components (pulled from the Espressif Component Registry on
# build). This replaces the Arduino lib_deps approach. Versions are starting
# points — pin/tighten once the board brings up cleanly.
dependencies:
  idf: ">=5.1"

  # Networking — Google Cast discovery (added now; used from M2).
  espressif/mdns: "^1.4.0"

  # cJSON — bundled in IDF <=5.x as component `json`, removed from IDF 6.0 core,
  # so we pull it from the registry. Used to parse Cast status payloads.
  espressif/cjson: "*"

  # GUI + display/touch drivers (M1 hardware bring-up).
  lvgl/lvgl: "^9.2.0"
  espressif/esp_lvgl_port: "^2.3.0"
  espressif/esp_lcd_sh8601: "^1.0.0"        # QSPI panel (this board is SH8601, not ST77916)
  espressif/esp_lcd_touch_cst816s: "^1.0.0" # I2C capacitive touch

  # Album-art JPEG decode (off-thread, in the albumart task).
  espressif/esp_new_jpeg: "^0.6.0"
