; PlatformIO project configuration for the ESP32-S3 Knob Cast controller.
;
; Framework: ESP-IDF (NOT Arduino). Chosen so we can mirror the architecture of
; the reference project ESPCaster (https://github.com/amitn/ESPCaster) — esp-tls,
; the ESP-IDF mdns component, cJSON, and LVGL-as-component — while keeping the
; uv + Just + PlatformIO toolchain. The Cast layer is a clean rewrite for this
; board, using ESPCaster only as a design reference.
;
; Target board: Waveshare ESP32-S3-Knob-Touch-LCD-1.8
;   - ESP32-S3R8 main MCU · 16 MB flash · 8 MB octal (OPI) PSRAM
;   - ST77916 360x360 round IPS (QSPI) · CST816 touch (I2C) · rotary encoder
;
; Always invoke via `uv run pio ...` (see the Justfile).

[platformio]
default_envs = knob

[env:knob]
platform  = espressif32@^6.9.0
board     = esp32-s3-devkitc-1-n16r8   ; 16MB flash + 8MB OPI PSRAM profile
framework = espidf

board_build.partitions  = partitions.csv
board_upload.flash_size = 16MB

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder, time, colorize

; ESP-IDF settings come from sdkconfig.defaults (PSRAM=octal, flash=16MB, etc).
; Managed components (LVGL, mdns, display/touch drivers) are declared in
; src/idf_component.yml. Local components live under components/.

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
