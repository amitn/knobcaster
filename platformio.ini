; PlatformIO project configuration for the ESP32-S3 Knob Cast controller.
;
; Framework: ESP-IDF (NOT Arduino). Chosen so we can mirror the architecture of
; the reference project ESPCaster (https://github.com/amitn/ESPCaster) — esp-tls,
; the ESP-IDF mdns component, cJSON, and LVGL-as-component — while keeping the
; uv + Just + PlatformIO toolchain. The Cast layer is a clean rewrite for this
; board, using ESPCaster only as a design reference.
;
; Target board: Waveshare ESP32-S3-Knob-Touch-LCD-1.8
;   - ESP32-S3R8 main MCU · 16 MB flash · 8 MB octal (OPI) PSRAM
;   - SH8601 360x360 round (QSPI) · CST816 touch (I2C) · rotary encoder
;
; Always invoke via `uv run pio ...` (see the Justfile).

[platformio]
default_envs = knob

[env:knob]
#platform  = espressif32@^6.9.0
platform  = espressif32@^7.0.1
board     = esp32s3-knob                ; custom profile in boards/ (16MB flash, 8MB OPI PSRAM)
framework = espidf

board_build.partitions  = partitions.csv
board_upload.flash_size = 16MB

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder, time, colorize

; This board muxes ONE USB-C port between the ESP32-S3 (native USB-Serial/JTAG,
; shows up as /dev/ttyACM*) and a secondary ESP32 (CH340 bridge, /dev/ttyUSB*).
; Pin upload/monitor to the ACM side so we never flash the wrong chip. (Override
; per-invocation with `just PORT=/dev/... flash`.) On macOS use /dev/cu.usbmodem*.
upload_port  = /dev/ttyACM*
monitor_port = /dev/ttyACM*

; ESP-IDF settings come from sdkconfig.defaults (PSRAM=octal, flash=16MB, etc).
; Managed components (mdns now; LVGL + display/touch drivers added later) are
; declared in src/idf_component.yml. Local components live under components/.

; build_flags =
;     -DLV_CONF_INCLUDE_SIMPLE   ; re-enabled when we ship include/lv_conf.h

; ---------------------------------------------------------------------------
; Host-native unit tests (`just test` -> pio test -e native). Exercises the
; pure parsers (cast_proto, cast_status) off-device. See docs/07-testing.md.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>      ; don't build the ESP-IDF app sources on the host
build_flags =
    -I components/cast/include
    -I components/cast
    -DUNIT_TEST
